</style></head><body><div class="mist-return noprint"><a href="../" target="_top">← 返回晶芽群島</a><span>獨立副本 · 迷霧孤島</span></div><header><h1>🗺️ TP查核島：三重交易謎團</h1><p>甲：總部與研發｜A、B：製造｜C：行銷</p><p>六章式互動查核故事｜證據先行・疑點與調整分流・逐題解析</p></header><div class="layout"><nav><strong>📖 案件章節</strong><div id="nav"></div><div class="progress"><div id="progress" style="width:0%"></div></div><small id="progressText"></small><p><button onclick="resetGame()">↻ 重設案件</button></p></nav><main class="sheet"><div id="app"></div><div class="footerbar noprint"><button id="prev" onclick="move(-1)">← 上一章</button><button id="next" onclick="move(1)">下一章 →</button></div></main></div><script src="a-adjustment.js"></script><script>
const chapters=['申報書的秘密','A公司：利潤迷宮','B公司：消失的保證費','C公司：跨境資金線索','查核會議與調整','結案報告與證書'];
const money=n=>{const value=TPAAdjustment.round(Number(n));return (Object.is(value,-0)?0:value).toLocaleString('en-US',{maximumFractionDigits:0})};const fmt=n=>Number(n).toFixed(2)+'%';
const names=['東昇電路','宏科電子','華新精密','聯峰科技','泰盛電路','晶華科技','永信線路','佳禾電子','亞太晶片','星辰設計','新宇半導體','安捷微電','遠東零件','鼎泰電子','利通科技','寰宇汽配','新航機械','歐陸精工','美洲動力','世紀工業'];
const sectors=['PCB製造','半導體設計','電子零組件','汽車零件','工業設備'];
const companies=names.map((name,i)=>({id:i,name,region:i<8?['亞太','歐洲','亞太','亞太','歐洲','亞太','亞太','美洲'][i]:['亞太','歐洲','美洲'][i%3],sector:i<8?'PCB製造':sectors[1+(i-8)%4],rd:i<8?0:[1.2,3.5,5.8,7.4,2.1,.8,6.3,4.6,1.7,7.8,2.9,5.1][i-8],margin:i<8?[7,8,8.5,9,9.5,10,11,13][i]:[5.2,16.8,3.4,12.6,18.1,4.7,14.2,6.5,20.3,2.9,11.7,15.4][i-8]}));
companies.push(...['青岳電路','海川精密','旭景電子','南嶼科技'].map((name,i)=>({id:20+i,name,region:'亞太',sector:'PCB製造',rd:null,margin:[8.2,11.8,17.1,23.4][i]})));
// Interleave industries while keeping stable company IDs and financial observations.
const companyOrder=[0,8,20,9,1,10,2,21,11,12,3,13,4,14,22,15,5,16,6,23,17,18,7,19];
companies.sort((a,b)=>companyOrder.indexOf(a.id)-companyOrder.indexOf(b.id));
const bases={AAA:3.60,AA:3.70,A:3.80,BBB:3.95,BB:4.10,B:4.25,CCC:4.45,CC:4.65,C:4.90};const ratings=Object.keys(bases);
const loanRows=(r,scope='B')=>Array.from({length:30},(_,i)=>{const n=i%15,secured=i<15,comparable=n<6,target=scope==='C'&&r!=='A'?800000:1000000;let currency='USD',year=115,term=1,industry=scope==='C'&&r!=='A'?'電子產品行銷':'電子製造',amount=target+Math.round((Math.sin((state.loanSeed||1)+n*17+ratings.indexOf(r)*13+scope.charCodeAt(0))*0.5+0.5)*40000)-20000;if(!comparable){if(n%5===1)currency=['TWD','EUR','JPY'][n%3];if(n%5===2)year=114;if(n%5===3)term=3;if(n%5===4)industry='不動產開發';if(n%5===0)amount=target+95000}return {id:r+'-v2-'+i,grade:r,secured,comparable,currency,year,date:year+'/03/'+String(3+n).padStart(2,'0'),term,industry,amount,rate:+(bases[r]+(secured?0:.50)+[-.10,-.06,-.02,.02,.06,.10][n%6]+(comparable?0:.12)).toFixed(2),bank:'模擬銀行'+String(i+1).padStart(2,'0')}});
const initial=()=>({chapter:0,selected:[],farInvestigation:{},returnParty:'',apacRd:{},compsSelectionVersion:1,region:'全部',sector:'全部',rating:'BB',loanSamples:{B:Object.fromEntries(ratings.map(r=>[r,[]])),C:Object.fromEntries(ratings.map(r=>[r,[]]))},loanSelectionVersion:1,answers:{},notes:{},bs:{B:{assets:1800000,liabilities:1300000,ebit:85000,interest:45000,revenue:2300000},C:{assets:1200000,liabilities:1000000,ebit:25000,interest:30000,revenue:950000}},confirmed:[],reviewed:false});let state;try{state=JSON.parse(localStorage.getItem('tp-mist-island-case-v3'))||initial()}catch{state=initial()};
const save=()=>{try{localStorage.setItem('tp-mist-island-case-v3',JSON.stringify({...state,selected:[]}))}catch(e){console.warn('Local storage unavailable',e)}};const q=(arr,p)=>{if(!arr.length)return null;let a=[...arr].sort((x,y)=>x-y),i=(a.length-1)*p;return a[Math.floor(i)]+(a[Math.ceil(i)]-a[Math.floor(i)])*(i-Math.floor(i))};

state.selected=[];state.compsSelectionVersion=2;

if(state.loanSelectionVersion!==2){state.loanSamples={B:Object.fromEntries(ratings.map(r=>[r,[]])),C:Object.fromEntries(ratings.map(r=>[r,[]]))};state.loanSelectionVersion=2;state.cFinance={};state.financeScenario=null}
state.bs??={};state.bs.A??={assets:9000000,liabilities:3600000,ebit:850000,interest:72000,revenue:18000000};
if(!state.loanSeed)state.loanSeed=Math.random()*100000;
const loanScope=()=>state.chapter===3?'C':'B';
const loanSelection=()=>state.loanSamples[loanScope()];
const englishStems=['Alderwick','Northmere','Valenbrook','Westhaven','Silverford','Lindencrest','Oakbridge','Stonehaven','Brightwell','Ashbourne','Riverton','Cedarvale'];
const englishSuffixes=['Circuits Ltd.','Electronics GmbH','Precision B.V.','Technologies S.A.','Industrial Systems AB','Components Ltd.'];
function assignEuropeanNames(){
 const used=new Set(),pool=[...englishStems];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 state.euCompanyNames=state.euCompanyNames||{};let next=0;
 for(const company of companies.filter(x=>x.region==='歐洲')){
 let name=state.euCompanyNames[company.id];
 if(typeof name!=='string'||! /^[A-Za-z .]+$/.test(name)||used.has(name))name=pool[next++]+' '+englishSuffixes[Math.floor(Math.random()*englishSuffixes.length)];
 used.add(name);state.euCompanyNames[company.id]=name;company.name=name;
 }
}
function assignFinancialSimulations(){state.farInvestigation=state.farInvestigation||{};if(!['A','甲'].includes(state.returnParty))state.returnParty='';state.apacRd=state.apacRd||{};for(const c of companies){if(c.id>=20){let value=state.apacRd[c.id];if(!Number.isFinite(value)||value<.5||value>10)value=Math.round((.5+Math.random()*9.5)*100)/100;state.apacRd[c.id]=value;c.rd=value}c.simulatedRevenue=1000000;c.simulatedProfit=c.simulatedRevenue*c.margin/100;c.simulatedCostOpex=c.simulatedRevenue-c.simulatedProfit;c.fullCostMargin=TPAAdjustment.fullCostMargin(c.margin)}}
assignEuropeanNames();assignFinancialSimulations();save();
const app=document.getElementById('app');function btn(text,fn){return `<button onclick="${fn}">${text}</button>`};function tag(t,kind=''){return `<span class="tag ${kind}">${t}</span>`};
const questions={b5:{q:'看到A公司進貨、B公司零保證費及C公司1%利息，現在可以直接認定三筆均應調整嗎？',opts:['可以，申報金額異常就是違反常規','不可以，先界定交易、取得證據並檢驗常規結果','只要A公司利潤率高就全部調整'],correct:1,why:'B5表與補充資料只能辨識風險，不能直接證明不合常規。必須先確認交易實質、FAR、可比較性與臺灣所得影響。'},a:{q:'A公司製造使用甲公司授權技術，且有32.00%與26.30%兩種利潤率，應先做什麼？',opts:['直接把32.00%降至可比公司中位數','先核對分部損益、利潤率分母、FAR及技術權利歸屬','因為高利潤在中國，甲公司必定補稅'],correct:1,why:'受測個體、利潤指標及交易分部未確定前，直接套用TNMM可能錯誤；高利潤也不等於臺灣必有補稅額。'},b:{q:'B公司BB級有擔保與無擔保借款利差，是否必然全額等於常規保證費？',opts:['是，兩中位數相減即為唯一正確答案','否，仍須檢查實際信用增強、隱含支持、期限與保證利益','應以C公司B級利差代替'],correct:1,why:'利差可作為教學估值起點，但須辨別集團隱含支持、信用增強及雙方利益分配，且樣本需具可比較性。'},c:{q:'C公司信用評等B，甲公司提出2.00%新臺幣借款利率，應如何處理？',opts:['公式是OECD強制規定，直接採用','套用兩方信評中位數，分開檢驗信用、地區及幣別差異與可比貸款','C公司已付1%所以無須查核'],correct:1,why:'跨境借款一般須分析借款人信用風險與交易條件。指定公式是本遊戲假設，不是OECD通用標準。'},end:{q:'查核結論應如何表達？',opts:['所有疑點一律列為已證實調整','區分已核實事實、待查疑點、條件式試算與依法可調整事項','只附計算表，不必說明法源及證據'],correct:1,why:'必須將風險辨識與證據充分的調整結論分開，並呈現法源、受測交易、計算方法與納稅人反論。'}};
function quiz(id){let x=questions[id],v=state.answers[id];return `<div class="panel"><h3>🧠 承辦判斷題</h3><p>${x.q}</p><div class="choices">${x.opts.map((o,i)=>`<label><input type="radio" name="${id}" ${v===i?'checked':''} onchange="answer('${id}',${i})"> ${String.fromCharCode(65+i)}. ${o}</label>`).join('')}</div>${v===undefined?'':`<div class="result ${v===x.correct?'good':'bad'}"><b>${v===x.correct?'✓ 判斷正確':'✗ 選錯 '+String.fromCharCode(65+v)+'；正確答案 '+String.fromCharCode(65+x.correct)}</b><p>${x.why}</p><small>參考研究方向：OECD TPG 2022 第I章交易準確界定與可比較性；第II章方法選擇；第VI章無形資產；第X章金融交易。正式引用應核對具體段落。</small></div>`}</div>`}
function answer(id,i){state.answers[id]=i;save();render()};function setChapter(n){state.chapter=Math.max(0,Math.min(5,n));state.visited=[...new Set([...(state.visited||[]),state.chapter])];if(n===2)state.rating='BB';if(n===3)state.rating='A';save();render();window.scrollTo(0,0)}function move(d){setChapter(state.chapter+d)}function resetGame(){if(confirm('確定清除本機儲存的案例進度？')){state=initial();state.bs.A={assets:9000000,liabilities:3600000,ebit:850000,interest:72000,revenue:18000000};assignEuropeanNames();assignFinancialSimulations();save();render()}}
function chapter0(){return `<h2>第一章｜申報書的秘密</h2><div class="story"><b>🌫️ 登島紀錄｜17:40，港口起霧。</b><p>甲公司的研發大樓還亮著燈，A、B工廠的輸送帶持續運轉，C的行銷團隊正在整理新一季的提案。一封銀行授信函，卻讓三條交易線同時浮出水面：製造技術、未收費的保證，以及跨境資金。你的任務，是從申報表開始，分辨疑點與證據。</p>🕵️ <b>稽核官林主任：</b>「這是甲公司115年度的關係人交易明細表。請不要急著下結論，先找出哪幾筆交易值得深入調查。」</div><p class="lead">甲公司位於臺灣，A公司位於中國、B公司位於美國、C公司位於中國。金額單位均為新臺幣千元，除另有註明。</p><div class="panel"><h3>📜 B5手繪重繪版｜關係人交易明細表</h3><p class="note">依上傳B5頁的欄位順序整理；本頁為可讀性重繪版，不是完整法定申報書。</p><div class="scroll"><table><thead><tr><th>關係人欄位</th><th>A公司</th><th>B公司</th><th>C公司</th></tr></thead><tbody>${[['國家代碼(B3)','CN','US','CN'],['營業收入淨額(I)','190,000,000','2,300,000','950,000'],['營業毛利(J)','76,000,000','350,000','120,000'],['營業淨利(K)','55,100,000','85,000','25,000'],['有形資產移轉：進貨(O3)','90,000,000','—','—'],['無形資產使用：收入(R1)','600,000','—','—'],['資金提供(T1)','—','—','800,000'],['利息收入(T2)','—','—','8,000'],['★ 背書保證實際動支（補充揭露，非B5原欄位）','—','1,000,000','—'],['★ 背書保證手續費收入（補充揭露）','—','0','—']].map(r=>`<tr>${r.map((v,i)=>`<td class="${i?'num':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">B/C損益為模擬生成。★ 標示兩列為附加在手繪B5表格中的「背書保證補充揭露」，非原B5法定欄位；B公司保證動支1,000,000千元、未收取手續費，仍須調閱保證契約及銀行授信資料。</p></div><div class="panel"><h3>📎 補充文件：銀行授信函</h3><p>B公司實際動支1,000,000千元，甲公司提供背書保證，未收取手續費。幣別USD。</p><p>甲公司信用評等A、銀行借款利率2%。甲、B、C公司均無第三方背書保證可直接作內部比較。</p></div>${quiz('b5')}`}
const farCards=[
 ['control','誰控制製造技術與重要研發決策？','檢查合約、研發預算、技術版本與決策紀錄，區分甲公司與A公司實際執行及控制的功能。'],

];

function segmentFormula(r){if(r.rawAdjustment===null)return '未觸發調整公式';return `${money(r.base)}千元 × (${fmt(r.actual)} − ${fmt(r.stats.median)})${r.royalty?' − '+money(r.royalty)+'千元':''} = ${money(r.rawAdjustment)}千元`}
function segmentResult(r){const title=r.kind==='return'?'回銷調整數':'未回銷調整數',applicable=r.kind!=='return'||r.testedParty==='A',sample=applicable?r.stats:null;return `<section class="adjustment-segment" data-segment="${r.kind}"><h3>${title}｜${r.indicator}</h3><p>受測個體：<b>${r.testedParty?(r.testedParty+'公司'):'尚未選擇'}</b>${applicable?`；利潤率：<b>${fmt(r.actual)}</b>；${r.kind==='return'?'受控交易總金額':'未回銷計算基礎'}：<b>${money(r.base)}千元</b>`:'；尚無本模型可用的受測利潤率及金額基礎'}</p>${sample?`<p>可比第25分位 <b>${fmt(sample.q25)}</b>｜中位數 <b>${fmt(sample.median)}</b>｜第75分位 <b>${fmt(sample.q75)}</b></p>`:`<p>可比區間：${r.status==='complex'?'甲公司尚未建立適用區間':'尚未選樣'}</p>`}<div class="result ${r.status==='above'?'good':r.status==='pending'||r.status==='complex'?'bad':'good'}"><b>${r.reason}</b>${r.rawAdjustment===null?'':`<p class="calculation-formula">${segmentFormula(r)}</p>`}<p>甲公司本分部所得調整：<strong>${money(r.adjustment)}千元</strong></p></div></section>`}
function aAdjustmentPanel(){const result=aAdjustment();return `<div class="panel" id="a-adjustments"><h3>🧮 甲公司所得調整｜回銷與未回銷分開計算</h3><p class="note">先檢查受測利潤率是否落於可比第25至第75分位；區間端點包含在內。低於第25分位，依本案指定的我國課稅方向不予調整；超過第75分位才以中位數代入公式。</p>${segmentResult(result.return)}${segmentResult(result.nonreturn)}<div class="lead"><b>甲公司所得調整合計：${money(result.total)}千元</b><br><small>本案所得調整試算，尚未乘以稅率，並非補稅金額。</small></div><details><summary>計算基礎與避免重複調整</summary><p>回銷：90,000,000千元 ×（32.00% − 可比成本及營業費用淨利率中位數）。</p><p>未回銷：100,000,000千元 ×（26.30% − 可比營業淨利率中位數）− 600,000千元已收權利金。權利金只在未回銷公式扣除一次。</p><p>兩個金額基礎依題目指定，不從利潤率分母反推；正式查核仍應與原始分部損益及交易範圍勾稽。若扣除權利金後為零或負數，保留原公式差額供檢查，本模型不再增加所得。</p></details></div>`}
function chapter1(){const filtered=companies.filter(x=>(state.region==='全部'||x.region===state.region)&&(state.sector==='全部'||x.sector===state.sector)),selected=companies.filter(x=>state.selected.includes(x.id)),ready=farReady(),costStats=TPAAdjustment.summarize(selected.map(x=>x.fullCostMargin)),salesStats=TPAAdjustment.summarize(selected.map(x=>x.margin));const statsLine=(label,s)=>`<p><b>${label}</b>：第25分位 <b>${s?fmt(s.q25):'—'}</b>｜中位數 <b>${s?fmt(s.median):'—'}</b>｜第75分位 <b>${s?fmt(s.q75):'—'}</b></p>`;
return `<h2>第二章｜A公司：利潤迷宮</h2><div class="story">🏭 <b>A公司財務主管：</b>「同一家製造公司也有不同交易分部。請先查清功能風險，再分別檢查回銷與未回銷的利潤。」</div><div class="grid"><div class="stat">回銷甲公司利潤率<small>（成本及營業費用淨利率）</small><b>32.00%</b></div><div class="stat">未回銷利潤率<small>（營業淨利率）</small><b>26.30%</b></div><div class="stat">授權技術收入（甲）<b>600,000</b>千元</div></div>
<div class="panel" id="far-investigation"><h3>① 🗂️ FAR調查卡｜先調查，再選樣</h3><p class="note">請逐項查閱並確認。這裡記錄調查進度，不會把勾選本身當成已核實證據。</p>${farCards.map(([key,title,detail])=>`<div class="far-item"><label><input type="checkbox" aria-label="FAR調查：${title}" ${state.farInvestigation[key]?'checked':''} onchange="setFar('${key}',this.checked)"> <b>${title}</b></label><p>${detail}</p></div>`).join('')}<p class="lead">${ready?'✓ 四項調查進度已確認，可以開始選取可比對象。':'尚未完成FAR調查；完成四項確認後，即可選取可比對象及計算調整。'}</p></div>
<div class="panel"><h3>② 選擇受測個體</h3><label for="return-tested-party">回銷交易受測個體 </label><select id="return-tested-party" onchange="setReturnParty(this.value)"><option value="">請選擇</option><option value="A" ${state.returnParty==='A'?'selected':''}>A公司</option><option value="甲" ${state.returnParty==='甲'?'selected':''}>甲公司</option></select>${state.returnParty==='A'?'<p>受測個體：A公司｜受控交易總金額 <b>90,000,000千元</b>｜成本及營業費用淨利率 <b>32.00%</b></p>':state.returnParty==='甲'?'<p class="lead">甲公司功能複雜，較難在市場上尋找具有相同FAR的可比對象；不能直接套用A公司的32.00%及其可比區間。</p>':'<p class="note">回銷先選擇受測個體；未回銷固定以A公司為受測個體。</p>'}<p>未回銷交易受測個體：<b>A公司</b>｜營業淨利率 <b>26.30%</b>｜計算基礎 <b>100,000,000千元</b></p></div>
<div class="panel" id="comparable-lab"><h3>③ 🔬 可比較公司搜尋實驗室</h3><div class="toolbar"><label>地區 <select aria-label="可比公司地區" onchange="state.region=this.value;save();render()">${['全部','亞太','歐洲','美洲'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select></label><label>產業 <select aria-label="可比公司產業" onchange="state.sector=this.value;save();render()">${['全部',...sectors].map(x=>`<option ${state.sector===x?'selected':''}>${x}</option>`).join('')}</select></label>${btn('清空','clearComps()')}</div>${ready?'':'<p class="note">可先瀏覽候選資料；選樣功能須先完成上方FAR調查卡。</p>'}<div class="scroll"><table><thead><tr><th>選取</th><th>候選公司</th><th>地區</th><th>產業</th><th>研發／營收</th><th>營業淨利率</th><th>成本及營業費用淨利率</th></tr></thead><tbody>${filtered.map(x=>`<tr><td><input type="checkbox" aria-label="選取${x.name}" ${state.selected.includes(x.id)?'checked':''} ${ready?'':'disabled'} onchange="toggleComp(${x.id})"></td><td>${x.name}</td><td>${x.region}</td><td>${x.sector}</td><td class="num">${fmt(x.rd)}</td><td class="num">${fmt(x.margin)}</td><td class="num">${fmt(x.fullCostMargin)}</td></tr>`).join('')}</tbody></table></div><p>本次已選 <b>${selected.length}</b> 家（跨篩選條件保留選取）。</p>${statsLine('回銷採用：成本及營業費用淨利率',costStats)}${statsLine('未回銷採用：營業淨利率',salesStats)}<details><summary>虛擬財務資料與兩種指標的換算假設</summary><p>每家公司假設營業收入為1,000,000千元，營業淨利＝營收 × 原營業淨利率；成本及營業費用＝營收－營業淨利。</p><p>成本及營業費用淨利率＝營業淨利 ÷（成本＋營業費用）＝營業淨利率 ÷（1－營業淨利率）。例如營業淨利率10.00%，換算為11.11%，不是10.00%。利潤率、分位數與中位數均先四捨五入至小數點後二位，再代入調整公式；各分部調整數四捨五入為整數後加總。</p></details><p class="note">每次開啟或重新整理均不預選公司；本次手動選樣在切換篩選及單元時保留。共${companies.length}家虛構公司；新增四家亞太PCB公司研發比率在0.50%至10.00%間隨機產生並保存，另保留五家亞太零研發PCB公司。歐洲公司採隨機英文名稱。分位數採線性插值。這組樣本供兩分部的指標練習；若兩分部FAR不同，正式分析應重新檢查選樣及分部可比較性。</p></div>${aAdjustmentPanel()}${quiz('a')}`}
function clearComps(){state.selected=[];save();render()}function toggleComp(i){if(!farReady())return;state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i];save();render()}
function bsTable(which){let b=state.bs[which];return `<div class="panel"><h3>${which==='A'?'甲':which}公司｜B/S + I/S 財務輸入器（模擬）</h3><div class="grid">${[['assets','資產總額'],['liabilities','負債總額'],['revenue','營業收入'],['ebit','息稅前利益EBIT'],['interest','利息費用']].map(([k,label])=>`<label>${label}<br><input type="number" min="0" value="${b[k]}" onchange="updateBS('${which}','${k}',this.value)"></label>`).join('')}</div><p>負債比率 <b>${fmt(b.assets?b.liabilities/b.assets*100:0)}</b>；利息保障倍數 <b>${b.interest?(b.ebit/b.interest).toFixed(2):'—'}</b></p><p>${tag('預設教學評等：'+(which==='A'?'A':which==='B'?'BB':'B'))} ${tag('模型未經校準，不可視為真實信用評等','warn')}</p><p class="note">財務數值可修改；評等為故事指定目標，不會由這些簡化比率自動推導。正式版本需建立有依據的評分門檻與產業校準。</p></div>`}function updateBS(w,k,v){state.bs[w]??={};state.bs[w][k]=Number(v)||0;save();render()}
function cLoan(){if(!state.financeScenario){const target=TPAAdjustment.round(4.23+Math.random()*1.57,2),ratio=(bases.B+.5)/(bases.A+.5);state.financeScenario={target,usd:TPAAdjustment.round(target/2/ratio/(3.5/2.62)*1.8,4)};}const {targetInterbank:legacyInterbank,...currentFinance}=state.cFinance||{};const input={parentGrade:'',borrowerGrade:'',parentRate:2,homeBase:2.62,targetBase:3.5,homeInterbank:1.8,usdInterbank:state.financeScenario.usd,...currentFinance},medians=Object.fromEntries(ratings.map(g=>[g,(()=>{const m=q(loanRows(g,'C').filter(x=>state.loanSamples.C[g].includes(x.id)).map(x=>x.rate),.5);return m===null?null:TPAAdjustment.round(m,2)})()])),a=medians[input.parentGrade],b=medians[input.borrowerGrade],ready=ratings.includes(input.parentGrade)&&ratings.includes(input.borrowerGrade)&&a>0&&b>0&&Object.entries(input).filter(([k])=>!k.endsWith('Grade')).every(([,v])=>Number.isFinite(v)&&v>0),credit=ready?input.parentRate*b/a:null,regional=ready?credit*input.targetBase/input.homeBase:null,rate=ready?TPAAdjustment.round(regional*input.usdInterbank/input.homeInterbank,2):null;return {input,medians,credit,regional,rate,interest:rate===null?null:TPAAdjustment.round(rate/100*800000),difference:rate===null?null:TPAAdjustment.round(rate/100*800000-8000)}}
function setCFinance(key,value){state.cFinance={...cLoan().input,[key]:key.endsWith('Grade')?value:Number(value)};save();render()}
function cLoanPanel(){const c=cLoan(),available=ratings.filter(g=>c.medians[g]!==null);for(const key of ['parentGrade','borrowerGrade'])if(!available.includes(c.input[key]))c.input[key]='';return `<div class="panel"><h3>🏦 各信評借款利率中位數</h3><p>按所選樣本整組計算，不分有擔保、無擔保，也不計算擔保利差。</p><table><tr><th>信評</th><th>已選樣本</th><th>年利率中位數</th></tr>${available.map(g=>`<tr><td>${g}</td><td>${state.loanSamples.C[g].length}</td><td>${fmt(c.medians[g])}</td></tr>`).join('')||'<tr><td colspan="3">請先勾選借款樣本，才會顯示相應信評中位數。</td></tr>'}</table></div><div class="panel" id="c-finance-adjustment"><h3>🧮 甲公司2.00%新臺幣借款 → C公司美金融資利率</h3><p>故事指定：甲公司信評A、C公司信評B。請自行套入相應評等；兩組樣本都選好才計算。</p><div class="grid">${[['parentGrade','甲公司套用信評'],['borrowerGrade','C公司套用信評']].map(([k,l])=>`<label>${l}<select aria-label="${l}" onchange="setCFinance('${k}',this.value)"><option value="">請選擇</option>${available.map(g=>`<option value="${g}" ${c.input[k]===g?'selected':''}>${g}｜${c.medians[g]===null?'未選樣':fmt(c.medians[g])}</option>`).join('')}</select></label>`).join('')}${[['parentRate','甲公司銀行借款利率（新臺幣）'],['homeBase','臺灣基準利率'],['targetBase','中國基準利率'],['homeInterbank','新臺幣拆款利率'],['usdInterbank','美金拆款利率']].map(([k,l])=>`<label>${l}（%）<input aria-label="${l}" type="number" step="0.01" min="0.01" value="${c.input[k]}" onchange="setCFinance('${k}',this.value)"></label>`).join('')}</div><ol><li>信用評等調整：甲借款利率 ×（C套用信評中位數 ÷ 甲套用信評中位數）＝ <b>${c.credit===null?'待選樣及套用':fmt(c.credit)}</b></li><li>地區基準調整：上一步 ×（中國基準 ÷ 臺灣基準）＝ <b>${c.regional===null?'—':fmt(c.regional)}</b></li><li>幣別拆款調整：上一步 ×（美金拆款 ÷ 新臺幣拆款）＝ <b>${c.rate===null?'—':fmt(c.rate)}</b></li></ol><p>全年利息：<strong>${c.interest===null?'尚缺資料':money(c.interest)+'千元'}</strong>；減已收8,000千元後差額：<strong>${c.difference===null?'尚缺資料':money(c.difference)+'千元'}</strong>。</p><p class="note">C公司借款幣別為美金；金額以新臺幣千元表達。本次虛擬情境以同條件無擔保A／B信評樣本為校準基準，參考利率 ${fmt(state.financeScenario.target)}；美金拆款假設 ${fmt(c.input.usdInterbank)}，為使教學結果落在4.23%～5.80%附近而設定，非市場報價。樣本或輸入改變時依公式重新計算，不限制結果區間。本案採三段比率連乘的教學模型；不是法定或OECD通用公式。地區與幣別因素可能重疊，正式分析須驗證，不應機械重複調整。中間步驟保留精度，最終年利率四捨五入至小數二位後計算利息，金額取整數。須另檢查期限、擔保及樣本條件的一致性。</p></div>`}

function loanPanel(){const funding=state.chapter===3,scope=loanScope(),tab=state.loanTab||'secured',rows=loanRows(state.rating,scope),shown=rows.filter(x=>x.secured===(tab==='secured')),selected=rows.filter(x=>loanSelection()[state.rating].includes(x.id)),s=q(selected.filter(x=>x.secured).map(x=>x.rate),.5),u=q(selected.filter(x=>!x.secured).map(x=>x.rate),.5);return `<div class="panel"><h3>🏦 外部金融資料庫（模擬）</h3><p>${funding&&state.rating==='A'?'甲':scope}公司比較基準：USD｜115年度｜1年期｜${scope==='B'||state.rating==='A'?'電子製造':'電子產品行銷'}｜金額新臺幣等值 ${money(scope==='B'||state.rating==='A'?1000000:800000)} 千元（容許差額 ±20,000 千元）。請自行檢查條件，不可比資料亦可勾選供反證。</p><div class="toolbar"><label>信用評等 <select aria-label="金融樣本信用評等" onchange="state.rating=this.value;save();render()">${ratings.map(r=>`<option ${state.rating===r?'selected':''}>${r}</option>`).join('')}</select></label> ${btn('清空本信評','clearLoans()')}</div><div role="tablist" aria-label="擔保條件">${['secured','unsecured'].map(k=>`<button role="tab" aria-selected="${tab===k}" onclick="setLoanTab('${k}')">${k==='secured'?'有擔保':'無擔保'}（15筆）</button>`).join('')}</div><div class="scroll"><table><tr><th>採用</th><th>銀行</th><th>信評</th><th>幣別</th><th>執行日</th><th>期限（年）</th><th>行業</th><th>金額（新臺幣等值千元）</th><th>年利率</th></tr>${shown.map(x=>`<tr><td><input aria-label="採用${x.grade}${x.bank}${x.secured?'有擔保':'無擔保'}" type="checkbox" ${loanSelection()[state.rating].includes(x.id)?'checked':''} onchange="toggleLoan('${x.id}')"></td><td>${x.bank}</td><td>${x.grade}</td><td>${x.currency}</td><td>${x.date}</td><td>${x.term}</td><td>${x.industry}</td><td>${money(x.amount)}</td><td>${fmt(x.rate)}</td></tr>`).join('')}</table></div>${funding?'':`<div class="grid"><div class="stat">有擔保中位數<b>${s===null?'—':fmt(s)}</b></div><div class="stat">無擔保中位數<b>${u===null?'—':fmt(u)}</b></div><div class="stat">利差（無−有）<b>${s===null||u===null?'—':fmt(u-s)}</b></div></div>`}<p class="note">每信評30筆，兩分頁各15筆，各有6筆符合上述條件；其他樣本至少一項條件不同。A級在資金單元對應甲公司的製造業條件，其他評等按本單元所示對象核對。相同條件配對之擔保利差為0.50個百分點。利率與資料為虛擬教學數 function chapter2(){return `<h2>第三章｜B公司：消失的保證費</h2><div class="story">🏦 <b>銀行授信專員：</b>「B公司沒有支付甲公司保證費。但沒有保證，它是否能以相同條件借款？這才是你要回答的問題。」</div><p class="lead">B公司：US｜實際動支新臺幣等值1,000,000千元｜美元借款｜115年度｜1年期｜電子製造｜未收取保證費｜故事指定信用評等BB。甲公司信用評等A。</p>${bsTable('B')}${loanPanel()}<div class="panel"><h3>📐 保證費試算</h3><p>選擇上方 <b>BB</b> 信評，保留有擔保及無擔保樣本，取兩組中位數之差。由於均為USD借款，教學假設不作地區及幣別調整。</p>${(()=>{let a=loanRows('BB').filter(x=>state.loanSamples.B.BB.includes(x.id)),s=q(a.filter(x=>x.secured).map(x=>x.rate),.5),u=q(a.filter(x=>!x.secured).map(x=>x.rate),.5);return `<p>BB利差：<b>${s===null||u===null?'樣本不足':fmt(u-s)}</b>；全年示例保證費：<b>${s===null||u===null?'—':money(Math.max(0,u-s)/100*1000000)} 千元</b></p>`})()}${tag('僅為條件式試算','warn')} ${tag('尚非已證實調整')}</div>${quiz('b')}`}
function chapter3(){return `<h2>第四章｜C公司：跨境資金線索</h2><div class="story">💼 <b>C公司財務經理：</b>「甲公司提出向銀行借入新臺幣資金，利率2.00%。我們公司是在中國，信評也不同，而且是借美金，你打算怎麼調整？」</div><div class="grid"><div class="stat">動支金額<b>800,000千元</b></div><div class="stat">已收利息<b>8,000千元</b></div><div class="stat">原利率<b>1.00%</b></div></div><div class="panel"><h3>甲、C公司信用與融資條件</h3><p>甲公司：製造業｜指定信評A｜銀行實際借款：新臺幣、115年度、1年期、年利率2.00%。C公司：電子產品行銷｜指定信評B｜中國營運、美金借款。</p><p class="note">資料庫A級樣本以甲公司的製造業條件為主；B級以C公司行銷業條件為主。資料庫USD利率用於本題信評差異比較，不能冒充甲公司實際TWD借款契約。跨產業等差異仍需驗證，本題三段比率為教學模型。</p></div>${bsTable('A')}${bsTable('C')}${loanPanel()}${cLoanPanel()}${quiz('c')}`}
function auditFindings(){
 const ac=aAdjustment(),bb=loanRows('BB').filter(x=>state.loanSamples.B.BB.includes(x.id)),secured=q(bb.filter(x=>x.secured).map(x=>x.rate),.5),unsecured=q(bb.filter(x=>!x.secured).map(x=>x.rate),.5),spread=secured===null||unsecured===null?null:unsecured-secured,aa=loanRows('A','C').filter(x=>state.loanSamples.C.A.includes(x.id)),median=q(aa.map(x=>x.rate),.5),rate=cLoan().rate;
 const segment=r=>`${r.kind==='return'?'回銷':'未回銷'}：${r.reason}${r.stats?'；第25分位'+fmt(r.stats.q25)+'、中位數'+fmt(r.stats.median)+'、第75分位'+fmt(r.stats.q75):''}。${r.rawAdjustment===null?'':segmentFormula(r)+'。'}本分部所得調整 ${money(r.adjustment)} 千元。`;
 return [
 {id:'A',question:'A公司32.00%及26.30%分部利潤是否可比，技術權利金是否適當',reason:(farReady()?'已完成四項FAR調查。':'尚缺完整FAR調查。')+`本次手動選樣 ${state.selected.length} 家。`+segment(ac.return)+segment(ac.nonreturn)+'未回銷已扣除600,000千元權利金，不再另加一次。',items:[{name:'A公司回銷所得調整',amount:ac.return.status==='pending'||ac.return.status==='complex'?null:ac.return.adjustment,formula:segmentFormula(ac.return),status:ac.return.reason},{name:'A公司未回銷所得調整',amount:ac.nonreturn.status==='pending'?null:ac.nonreturn.adjustment,formula:segmentFormula(ac.nonreturn),status:ac.nonreturn.reason}]},
 {id:'B',question:'B公司未收保證費，是否存在可衡量信用增強',reason:spread===null?'未選足BB級有擔保及無擔保樣本，無法計算利差；請回B公司單元補足兩組樣本。':`本次BB級有擔保中位數 ${fmt(secured)}，無擔保中位數 ${fmt(unsecured)}，利差 ${fmt(spread)}。以實際動支1,000,000千元乘以正利差，保證費試算 ${money(Math.max(0,spread)*10000)} 千元。`+(spread>0?'仍須區分集團隱含支持與明示保證的增額利益，核實期間及利益分配後，才能支持同額調整。':'未見正利差，本次不增加所得。'),items:[{name:'B公司保證費',amount:spread===null?null:TPAAdjustment.round(Math.max(0,spread)*10000),formula:spread===null?'缺少兩組BB級樣本':`1,000,000 × max(0, ${fmt(spread)})`,status:spread===null?'資料不足':spread>0?'已帶入試算；信用增強仍須核實':'不增加所得'}]},
 {id:'C',question:'C公司1.00%利率是否反映信用、地區與幣別差異',reason:rate===null?'請先選取甲與C公司相應信評的銀行樣本，並在第四章套用兩個評等；不以擔保利差計算。':`以甲公司新臺幣銀行借款利率${fmt(cLoan().input.parentRate)}出發，依序乘上C／甲信用評等中位數比、中國／臺灣基準利率比、美金／新臺幣拆款利率比，得到${fmt(rate)}。全年利息${money(cLoan().interest)}千元，扣除已收8,000千元後差額${money(cLoan().difference)}千元。三項差異的獨立性與可比較性仍須核實。`,items:[{name:'C公司利息差額',amount:cLoan().difference,formula:rate===null?'尚缺相應信評樣本或未套用評等':`800,000 × ${fmt(rate)} − 8,000`,status:rate===null?'資料不足':'已帶入第四章試算；差異調整假設仍須核實'}]}

 ];
}
function chapter4(){const findings=auditFindings(),items=findings.flatMap(f=>f.items);return `<h2>第五章｜查核會議與調整</h2><div class="story">⚖️ <b>林主任：</b>「把每一個疑點接上證據、理由與金額。前面算好的數字會帶進底稿；資料不夠的地方，也要說清楚。」</div><h3>🟠 查核疑點清單</h3><div class="panel">${findings.map(f=>`<p><b>${f.id}公司</b>｜${f.question}</p>`).join('')}</div><h3>🟢 已證實可調整事項</h3><div class="panel" id="audit-reasons"><p class="note">依本次調查與選樣自動撰寫，逐點回覆疑點；已完成的教學計算與仍需核實的事實分別說明。</p>${findings.map(f=>`<section><h4>${f.id}案｜${f.question}</h4><p>${f.reason}</p></section>`).join('')}</div><h3>🧾 調整底稿</h3><div class="scroll" id="audit-workpaper"><table><thead><tr><th>項目</th><th>前章計算依據</th><th>自動帶入（千元）</th><th>調整理由／資料狀態</th></tr></thead><tbody>${items.map(r=>`<tr><td>${r.name}</td><td>${r.formula}</td><td class="num">${r.amount===null?'尚缺資料':money(r.amount)}</td><td>${r.status}</td></tr>`).join('')}</tbody></table></div><p class="note">金額為所得調整或條件式試算，尚未乘稅率；缺資料不以0取代。本底稿即時連動前章選樣，不另填金額。</p>${quiz('end')}`}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function saveMemo(){state.notes.memo=document.getElementById('memo').value;save();alert('已儲存在此瀏覽器')}
function chapter5(){let ids=Object.keys(questions),answered=ids.filter(x=>state.answers[x]!==undefined),score=ids.reduce((n,x)=>n+(state.answers[x]===questions[x].correct?20:0),0),passed=answered.length===ids.length&&score>=70;return `<h2>第六章｜結案報告與證書</h2><div class="story">🏆 <b>結案會議：</b>「完成調查並不表示所有疑點都要調整。真正的查核能力，是能說明哪些證據支持結論，以及哪些事項仍待釐清。」</div><div class="grid"><div class="stat">答題完成<b>${answered.length}/5</b></div><div class="stat">目前得分<b>${score}/100</b></div><div class="stat">等級<b>${answered.length<5?'未完成':score>=90?'特優':passed?'合格':'再接再厲'}</b></div></div><div class="panel"><h3>📑 自動結案報告</h3><p><b>一、案件背景：</b>甲公司位於TW，與CN的A、US的B及CN的C存在製造進貨、製造技術授權、背書保證與關係人融資交易。</p><p><b>二、申報及查核資料：</b>A進貨90,000,000千元、無形資產使用收入600,000千元；B保證動支1,000,000千元、未收費；C資金動支800,000千元、利息收入8,000千元。</p><p><b>三、查核程序：</b>B5勾稽、FAR與分部損益檢查、24家模擬可比較公司篩選、B/C財報及信用評等分析、外部借款樣本利差及跨境利率假設試算。</p><p><b>四、主要發現：</b>A公司財務數據已校正且勾稽一致；A公司交易及權利金須再界定；B保證利益及C借款人信用風險待證實。</p><p><b>五、法規與分析架構：</b>參照我國移轉訂價查核準則及OECD TPG 2022第I、II、VI、X章；具體法條及段落須於正式查核報告逐項核對，且OECD指引不直接取代我國法律。</p>${aAdjustmentPanel()}<p><b>六、調整結論：</b>現有資料僅足以形成查核疑點及條件式試算，尚無充分證據直接認定應調整金額。須先核對合約、交易實質、可比較性、臺灣課稅方向及雙重課稅影響。</p><p><b>七、承辦備忘：</b>${escapeHtml(state.notes.memo||'尚未填寫')}</p></div><div class="panel"><h3>📝 逐題答題解析</h3>${ids.map(id=>`<details><summary>${questions[id].q} ${state.answers[id]===undefined?'未作答':state.answers[id]===questions[id].correct?'✓':'✗'}</summary><p>你的答案：${state.answers[id]===undefined?'未作答':questions[id].opts[state.answers[id]]}</p><p><b>正確答案：</b>${questions[id].opts[questions[id].correct]}</p><p>${questions[id].why}</p></details>`).join('')}</div>${answered.length===5?`<div class="certificate"><h2>🎖️ TP查核島</h2><p>移轉訂價案例研習證書</p><h1>${score>=90?'特優':passed?'合格':'再接再厲'}</h1><p>本次測驗得分 ${score} 分</p><p>「三重交易謎團」六章研習</p><small>教學模擬證書，非正式專業資格認證</small></div>`:'<p class="lead">請先完成前五章的判斷題，才會產生結案等級與證書。</p>'}<p class="noprint">${btn('🖨️ 列印／另存PDF','window.print()')} <a class="report-download" id="download-case-word">下載 Word 報告 .docx</a> <a class="report-download" id="download-case-odt">下載 ODT 報告 .odt</a></p>`}

function render(){document.getElementById('nav').innerHTML=chapters.map((x,i)=>`<button class="${i===state.chapter?'active':''}" onclick="setChapter(${i})">${i+1}. ${x}</button>`).join('');document.getElementById('progress').style.width=((state.chapter+1)/6*100)+'%';document.getElementById('progressText').innerText=`第${state.chapter+1}章／共6章 · 本機自動保存`;app.innerHTML=[chapter0,chapter1,chapter2,chapter3,chapter4,chapter5][state.chapter]();document.getElementById('prev').disabled=state.chapter===0;document.getElementById('next').disabled=state.chapter===5;document.getElementById('next').innerText=state.chapter===4?'前往結案報告 →':'下一章 →';if(typeof refreshReportDownloads==='function')refreshReportDownloads()}render();
</script><script src="a-stages.js"></script><script src="report-export.js"></script></body></html>
